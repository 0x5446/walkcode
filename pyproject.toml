[project]
name = "walkcode"
version = "0.14.40"
description = "Channel-native Lark/Feishu runtime for Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [{name = "0x5446"}]
keywords = ["claude-code", "codex", "agent", "human-in-the-loop", "lark", "feishu", "remote"]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
# Both are runtime requirements, not extras: a bare install without them
# builds a venv whose Lark ingress and Claude transport both fail at import —
# the 2026-07-24/25 silent-disconnect outage.
dependencies = [
    "claude-agent-sdk>=0.2.124",
    "lark-oapi>=1.4",
]

[project.urls]
Homepage = "https://github.com/0x5446/walkcode"

[project.scripts]
walkcode = "walkcode.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/walkcode"]
