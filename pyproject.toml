[project]
name = "walkcode"
version = "0.14.8"
description = "Channel-native Telegram/Lark runtime for Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [{name = "0x5446"}]
keywords = ["claude-code", "codex", "agent", "human-in-the-loop", "telegram", "lark", "remote"]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
lark = ["lark-oapi>=1.4"]

[project.urls]
Homepage = "https://github.com/0x5446/walkcode"

[project.scripts]
walkcode = "walkcode.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/walkcode"]
